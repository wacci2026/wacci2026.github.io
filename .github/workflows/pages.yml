name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Reconstruct the image only on the runner; the PNG stays out of Git history.
      - name: Restore payment QR from deployment secret
        env:
          PAYMENT_QR_BASE64: ${{ secrets.PAYMENT_QR_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ.get("PAYMENT_QR_BASE64", "").strip()
          if not encoded:
              raise SystemExit("Missing PAYMENT_QR_BASE64 Actions secret. Configure it before deploying the payment page.")
          image = base64.b64decode(encoded, validate=True)
          if not image.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("PAYMENT_QR_BASE64 must contain a base64-encoded PNG image.")
          target = Path("public/local-payment/QR_pago_WACCI.png")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(image)
          PY

      - name: Build static site
        env:
          # Apps Script /exec URL — set in Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_REGISTRATION_ENDPOINT: ${{ vars.REGISTRATION_ENDPOINT }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "wacci2026/wacci2026.github.io" ]; then
            touch .deploy-root
          fi
          env -u GITHUB_REPOSITORY npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
